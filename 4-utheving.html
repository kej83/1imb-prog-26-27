<!DOCTYPE html>

<body>
    <h1>Utheving</h1>

    <h2>Fet skrift</h2>

    <p>Dette er vanlig skrift. <strong>Dette er fet skrift</strong>.</p>

    <h2>Kursiv skrift</h2>
    <p>Vanlig her, <em>kursiv her</em></p>

    <h2>Kombinasjon</h2>
    <p>Vanlig her, <strong>bare fet <em>fet og kursiv</em></strong></p>


</body>
</html>
