<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tabeller</h1>

    <h2>Terningkast</h2>

    <!-- 
    tr : table row
    td : table data -->
    <table>
        <tr>
<td>Kastnr.</td>
<td>1</td>
<td>2</td>
<td>3</td>
<td>4</td>
        </tr>

        <tr>
            <td>Resultat</td>
            <td>4</td>
            <td>6</td>
            <td>1</td>
            <td>4</td>
        </tr>
    </table>

    <h2>Table med overskriftsrad</h2>
<!-- th : table header -->
    <table>
        <tr>
            <th>Fornavn</th>
            <th>Etternavn</th>
            <th>Bosted</th>
        </tr>
        <tr>
            <td>Jens</td>
            <td>Bergenstolt</td>
            <td>Oslo</td>
        </tr>
        <tr>
            <td>Arne</td>
            <td>Bakke</td>
            <td>Jessheim</td>
        </tr>
    </table>
</body>
</html>
