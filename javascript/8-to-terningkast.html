<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Math.random() - gir tilfeldig tall mellom 0 og 1
        // Math.ceil() - runder opp til nærmeste heltall
        let kastA = Math.ceil(Math.random()*6);
        let kastB = Math.ceil(Math.random()*6);

        document.write(`<h3>kastA = ${kastA},kastB = ${kastB}</h3>`);

        // Sjekk om de ble like
        if (kastA === kastB) {
            document.write("<p>Likt antall øyne!</p>");
        }

        // Sjekk om det er minst 1 femmer ( 1 eller fler)
        if (kastA == 5 || kastB == 5) {
            document.write("<p>Du fikk minst 1 femmer!</p>");
        }

        // Sjekk om begge ble under 4
        if ( kastA < 4 && kastB < 4) {
            document.write("<p>Begge under fire!</p>");
        }

    </script>
</body>
</html>
